[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reva-tsad"
version = "0.1.0"
description = "REVA: Reference-Guided Screening and Evidence-Driven Agentic Verification for Time Series Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "open_clip_torch==3.2.0",
  "openai==2.11.0",
  "scipy==1.15.3",
  "Pillow==12.0.0",
  "PyYAML==6.0.2",
]

[project.scripts]
reva = "reva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
