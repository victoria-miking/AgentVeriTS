name: tests

on:
  push:
    branches: [main, agentverits-paper-sync]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Run tests without external model calls
        run: python -m unittest discover -s tests -v
